<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08080b">
<title>অ্যাডমিন · CLIPVAULT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#08080b;--panel:#101015;--panel2:#16161d;--line:#25242c;--gold:#d6a93f;--gold2:#f3d27e;--text:#ece8dc;--muted:#938f84;--bad:#e5534b;--ok:#58b97a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--text);font-family:"Hind Siliguri",system-ui,sans-serif;line-height:1.55;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.logo{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:23px;letter-spacing:.14em;color:var(--gold2)}
.btn{border:0;border-radius:9px;padding:9px 18px;font-weight:600;cursor:pointer;font-size:14.5px;background:var(--panel2);border:1px solid var(--line)}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1405;border:0}
.btn.red{color:var(--bad)}
.btn.sm{padding:5px 11px;font-size:13px}
input,textarea,select{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13.5px;color:var(--muted);margin:12px 0 4px}
.msg{font-size:14px;min-height:20px;margin-top:8px}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
#login{max-width:380px;margin:12vh auto;padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
#login h1{font-size:20px;margin:6px 0 10px}
#app{display:none;min-height:100vh}
aside{position:fixed;inset:0 auto 0 0;width:210px;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;z-index:30}
aside .logo{padding:2px 10px 14px}
.nav{background:none;border:0;text-align:left;padding:10px 12px;border-radius:9px;cursor:pointer;color:var(--muted);font-size:15px}
.nav.on{background:var(--panel2);color:var(--gold2);font-weight:600}
main{margin-left:210px;padding:24px 26px 60px;max-width:980px}
main h2{font-size:22px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat small{color:var(--muted);font-size:13px}.stat b{display:block;font-size:28px;color:var(--gold2)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row img,.row .ph{width:76px;height:48px;object-fit:cover;border-radius:7px;background:var(--panel2);flex:none}
.row .t{flex:1;min-width:0}.row .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.row small{color:var(--muted)}
.tag{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:0 7px;color:var(--muted)}
.top{display:none}
@media(max-width:820px){
  aside{transform:translateX(-100%);transition:transform .2s}
  aside.open{transform:none}
  main{margin-left:0;padding:70px 14px 60px}
  .top{display:flex;position:fixed;inset:0 0 auto 0;height:54px;background:var(--panel);border-bottom:1px solid var(--line);align-items:center;gap:12px;padding:0 12px;z-index:20}
  .two{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){aside{transition:none}}
</style>
<script src="config.js"></script>
</head>
<body>
<div id="login">
  <div class="logo">CLIPVAULT</div>
  <h1>অ্যাডমিন লগইন</h1>
  <label for="em">ইমেইল</label><input id="em" type="email" autocomplete="username">
  <label for="pw">পাসওয়ার্ড</label><input id="pw" type="password" autocomplete="current-password">
  <button class="btn gold" id="lg" style="width:100%;margin-top:16px">ঢুকুন</button>
  <div class="msg" id="lm"></div>
</div>

<div id="app">
  <div class="top"><button class="btn sm" id="mb" aria-label="মেনু">☰</button><span class="logo">CLIPVAULT</span></div>
  <aside id="sb">
    <div class="logo">CLIPVAULT</div>
    <button class="nav on" data-p="dash">📊 ড্যাশবোর্ড</button>
    <button class="nav" data-p="vids">🎬 ভিডিও</button>
    <button class="nav" data-p="msgs">💬 বার্তা</button>
    <button class="nav" data-p="set">⚙ সেটিংস</button>
    <button class="nav" id="out" style="margin-top:auto">🚪 লগআউট</button>
  </aside>
  <main>
    <section id="p-dash">
      <h2>ড্যাশবোর্ড</h2>
      <div class="stats">
        <div class="stat"><small>মোট ভিডিও</small><b id="s1">০</b></div>
        <div class="stat"><small>মোট দেখা</small><b id="s2">০</b></div>
        <div class="stat"><small>মোট ডাউনলোড</small><b id="s3">০</b></div>
        <div class="stat"><small>নতুন বার্তা</small><b id="s4">০</b></div>
      </div>
      <div class="box"><b>সবচেয়ে বেশি ডাউনলোড</b><div id="top5"></div></div>
    </section>

    <section id="p-vids" hidden>
      <h2>ভিডিও</h2>
      <div class="box">
        <b id="ft">নতুন ভিডিও যোগ করুন</b>
        <input type="hidden" id="eid">
        <div class="two">
          <div><label for="vt">শিরোনাম *</label><input id="vt" maxlength="120"></div>
          <div><label for="vc">ক্যাটাগরি</label><input id="vc" maxlength="30" placeholder="যেমন: অ্যানিমেশন"></div>
          <div><label for="vu">ভিডিওর লিংক * (mp4, YouTube, Google Drive)</label><input id="vu" inputmode="url"></div>
          <div><label for="vd">ডাউনলোডের লিংক (ফাঁকা রাখলে ভিডিওর লিংকই)</label><input id="vd" inputmode="url"></div>
          <div><label for="vh">থাম্বনেইল ছবির লিংক</label><input id="vh" inputmode="url"></div>
          <div><label for="vl">সময় (যেমন ০:৩৬)</label><input id="vl" maxlength="10"></div>
        </div>
        <label for="vx">বিবরণ</label><textarea id="vx" maxlength="400"></textarea>
        <label style="display:flex;gap:8px;align-items:center;color:var(--text)"><input type="checkbox" id="vp" checked style="width:auto"> সাইটে দেখান</label>
        <div style="display:flex;gap:10px;margin-top:14px"><button class="btn gold" id="sv">সেভ করুন</button><button class="btn" id="cl">নতুন করে শুরু</button></div>
        <div class="msg" id="vm"></div>
      </div>
      <div class="box" id="vl2"></div>
    </section>

    <section id="p-msgs" hidden>
      <h2>দর্শকদের বার্তা</h2>
      <div class="box" id="ml"></div>
    </section>

    <section id="p-set" hidden>
      <h2>সেটিংস</h2>
      <div class="box">
        <label for="s_name">সাইটের নাম</label><input id="s_name" maxlength="40">
        <label for="s_notice">নোটিশ (সাইটের ওপরে দেখাবে, ফাঁকা রাখলে দেখাবে না)</label><input id="s_notice" maxlength="160">
        <label for="s_wait">ডাউনলোডের আগে অপেক্ষার সময় (সেকেন্ড, ৩ থেকে ৬০)</label><input id="s_wait" type="number" min="3" max="60">
        <label for="s_ad">বিজ্ঞাপনের কোড (বিজ্ঞাপন নেটওয়ার্ক থেকে যে কোড দেবে সেটা পেস্ট করুন)</label>
        <textarea id="s_ad" style="min-height:130px;font-family:monospace;font-size:13px" spellcheck="false"></textarea>
        <button class="btn gold" id="ss" style="margin-top:14px">সেভ করুন</button>
        <div class="msg" id="sm"></div>
      </div>
    </section>
  </main>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,getDocs,query,orderBy,limit,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>{try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:""}catch(e){return ""}};
const bn=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
const C=window.CFG||{};
const ok=C.firebase&&C.firebase.apiKey&&!/^PASTE/.test(C.firebase.apiKey)&&C.adminEmail&&!/^PASTE/.test(C.adminEmail);
if(!ok){$("#lm").className="msg bad";$("#lm").textContent="config.js এ Firebase-এর তথ্য আর অ্যাডমিন ইমেইল বসাতে হবে।";$("#lg").disabled=true;}
let auth,db,videos=[],msgs=[];
if(ok){const app=initializeApp(C.firebase);auth=getAuth(app);db=getFirestore(app);}

async function login(){
  const m=$("#lm");m.className="msg";m.textContent="";
  try{await signInWithEmailAndPassword(auth,$("#em").value.trim(),$("#pw").value);}
  catch(e){m.className="msg bad";m.textContent="ইমেইল বা পাসওয়ার্ড ঠিক নেই।";}
}
if(ok){
  $("#lg").onclick=login;
  $("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")login();});
  onAuthStateChanged(auth,async u=>{
    if(u&&u.email&&u.email.toLowerCase()===C.adminEmail.toLowerCase()){
      $("#login").style.display="none";$("#app").style.display="block";await refresh();
    }else{
      if(u){await signOut(auth);$("#lm").className="msg bad";$("#lm").textContent="এই ইমেইল অ্যাডমিন নয়।";}
      $("#login").style.display="block";$("#app").style.display="none";
    }
  });
  $("#out").onclick=()=>signOut(auth);
}

/* navigation */
function go(p){
  document.querySelectorAll("main section").forEach(s=>s.hidden=s.id!=="p-"+p);
  document.querySelectorAll(".nav[data-p]").forEach(b=>b.classList.toggle("on",b.dataset.p===p));
  $("#sb").classList.remove("open");
  if(p==="set")loadSettings();
}
document.querySelectorAll(".nav[data-p]").forEach(b=>b.onclick=()=>go(b.dataset.p));
$("#mb").onclick=()=>$("#sb").classList.toggle("open");

async function refresh(){
  const [v,m]=await Promise.all([
    getDocs(query(collection(db,"vd_videos"),orderBy("createdAt","desc"),limit(300))),
    getDocs(query(collection(db,"vd_msgs"),orderBy("createdAt","desc"),limit(100)))
  ]);
  videos=v.docs.map(d=>({id:d.id,...d.data()}));
  msgs=m.docs.map(d=>({id:d.id,...d.data()}));
  drawDash();drawVideos();drawMsgs();
}
function drawDash(){
  $("#s1").textContent=bn(videos.length);
  $("#s2").textContent=bn(videos.reduce((a,v)=>a+(v.views||0),0));
  $("#s3").textContent=bn(videos.reduce((a,v)=>a+(v.downloads||0),0));
  $("#s4").textContent=bn(msgs.length);
  const t=[...videos].sort((a,b)=>(b.downloads||0)-(a.downloads||0)).slice(0,5);
  $("#top5").innerHTML=t.length?t.map(v=>`<div class="row"><div class="t"><b>${esc(v.title)}</b><small>${bn(v.views||0)} বার দেখা</small></div><b>${bn(v.downloads||0)}</b></div>`).join(""):'<p style="color:var(--muted);margin-top:8px">এখনো কোনো ভিডিও নেই।</p>';
}
function drawVideos(){
  $("#vl2").innerHTML=videos.length?videos.map(v=>`<div class="row">
    ${v.thumb&&safe(v.thumb)?`<img src="${esc(safe(v.thumb))}" alt="">`:'<div class="ph"></div>'}
    <div class="t"><b>${esc(v.title)}</b><small>${esc(v.category||"ক্যাটাগরি নেই")} · ${bn(v.views||0)} দেখা · ${bn(v.downloads||0)} ডাউনলোড</small> ${v.published===false?'<span class="tag">লুকানো</span>':""}</div>
    <button class="btn sm" data-e="${v.id}">এডিট</button><button class="btn sm red" data-d="${v.id}">মুছুন</button></div>`).join(""):'<p style="color:var(--muted)">এখনো কোনো ভিডিও যোগ করা হয়নি।</p>';
}
function drawMsgs(){
  $("#ml").innerHTML=msgs.length?msgs.map(m=>`<div class="row"><div class="t" style="white-space:normal"><b style="white-space:normal">${esc(m.name)}</b><span>${esc(m.text)}</span><br><small>${m.createdAt?.toDate?m.createdAt.toDate().toLocaleString("bn-BD"):""}</small></div><button class="btn sm red" data-m="${m.id}">মুছুন</button></div>`).join(""):'<p style="color:var(--muted)">কোনো বার্তা নেই।</p>';
}

/* video form */
const F=["vt","vc","vu","vd","vh","vl","vx"];
function clearForm(){F.forEach(i=>$("#"+i).value="");$("#eid").value="";$("#vp").checked=true;$("#ft").textContent="নতুন ভিডিও যোগ করুন";$("#vm").textContent="";}
$("#cl").onclick=clearForm;
$("#sv").onclick=async()=>{
  const m=$("#vm");m.className="msg";
  const title=$("#vt").value.trim(),url=safe($("#vu").value.trim());
  if(!title||!url){m.className="msg bad";m.textContent="শিরোনাম আর সঠিক ভিডিও লিংক (https দিয়ে শুরু) দিতে হবে।";return;}
  const data={title,category:$("#vc").value.trim(),url,download:safe($("#vd").value.trim()),thumb:safe($("#vh").value.trim()),duration:$("#vl").value.trim(),desc:$("#vx").value.trim(),published:$("#vp").checked};
  try{
    const id=$("#eid").value;
    if(id)await updateDoc(doc(db,"vd_videos",id),data);
    else await addDoc(collection(db,"vd_videos"),{...data,views:0,downloads:0,createdAt:serverTimestamp()});
    m.className="msg ok";m.textContent="সেভ হয়েছে।";clearForm();m.className="msg ok";m.textContent="সেভ হয়েছে।";await refresh();
  }catch(e){m.className="msg bad";m.textContent="সেভ হয়নি। Firebase Rules ঠিক আছে কিনা দেখুন।";}
};
document.addEventListener("click",async e=>{
  const ed=e.target.closest("[data-e]");
  if(ed){const v=videos.find(x=>x.id===ed.dataset.e);if(!v)return;
    $("#eid").value=v.id;$("#vt").value=v.title||"";$("#vc").value=v.category||"";$("#vu").value=v.url||"";$("#vd").value=v.download||"";$("#vh").value=v.thumb||"";$("#vl").value=v.duration||"";$("#vx").value=v.desc||"";$("#vp").checked=v.published!==false;
    $("#ft").textContent="ভিডিও এডিট করছেন";window.scrollTo({top:0,behavior:"smooth"});return;}
  const de=e.target.closest("[data-d]");
  if(de&&confirm("এই ভিডিও মুছে ফেলবেন?")){await deleteDoc(doc(db,"vd_videos",de.dataset.d));await refresh();return;}
  const dm=e.target.closest("[data-m]");
  if(dm){await deleteDoc(doc(db,"vd_msgs",dm.dataset.m));await refresh();}
});

/* settings */
async function loadSettings(){
  const s=await getDoc(doc(db,"vd_settings","main"));const d=s.exists()?s.data():{};
  $("#s_name").value=d.siteName||"CLIPVAULT";$("#s_notice").value=d.notice||"";$("#s_wait").value=d.wait||10;$("#s_ad").value=d.adCode||"";
}
$("#ss").onclick=async()=>{
  const m=$("#sm");m.className="msg";
  try{
    const w=Math.max(3,Math.min(60,parseInt($("#s_wait").value,10)||10));
    await setDoc(doc(db,"vd_settings","main"),{siteName:$("#s_name").value.trim()||"CLIPVAULT",notice:$("#s_notice").value.trim(),wait:w,adCode:$("#s_ad").value.trim()});
    m.className="msg ok";m.textContent="সেভ হয়েছে।";
  }catch(e){m.className="msg bad";m.textContent="সেভ হয়নি। Firebase Rules দেখুন।";}
};
</script>
</body>
</html>
